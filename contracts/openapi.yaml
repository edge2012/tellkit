openapi: 3.1.0
info:
  title: Tellkit 公共 API（草案，待冻结）
  version: 0.1.0
  description: 来源：src/docs/architecture-v2.0.md §6；§3 仅辅助数据字段。所有路径显式声明鉴权，security
    的空对象仅允许说明中限定的匿名资源。错误码与 errors.md 一致；未明确语义列入 README 待冻结项。
servers:
- url: http://192.0.2.1:8099
  description: 一期 IP 直连
paths:
  /api/v1/episodes:
    post:
      summary: 提交新的一集
      description: 父会话提交输入，经门禁和额度检查后创建异步任务；写请求必须携带幂等键。
      operationId: submitEpisode
      security:
      - ParentSession: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 提交新的一集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
              example:
                episode_id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                version: 1
                job_id: 65d7a861-4ef1-42db-b8c2-23260b0dd902
                state: queued
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailableGateDown'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgress'
        '402':
          $ref: '#/components/responses/Error402QuotaExceeded'
        '422':
          $ref: '#/components/responses/Error422GateGuideGateRefuse'
        '200':
          description: 内容拒绝或一次追问；没有创建集、排队或扣额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              prompt: 六颗糖分给三个人
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - GATE_DOWN
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
      - QUOTA_EXCEEDED
      - GATE_GUIDE
      - GATE_REFUSE
    get:
      summary: 列出我的集或广场作品
      description: 缺省 scope=mine 兼容原私密列表；scope=plaza 无需登录，返回官方及 visibility=published
        的社区作品。官方固定在前，社区按 published_at DESC、id DESC。公开卡片及播放绑定 published_version；作者列表和详情显示
        current_version 及 visibility。
      operationId: listEpisodes
      security:
      - {}
      - ParentSession: []
      - ParentSessionCookie: []
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/EpisodeScope'
      responses:
        '200':
          description: 列出我的集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeList'
              example:
                items:
                - id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                  title: 分糖
                  status: making
                  current_version: 1
                  latest_version: 2
                next_cursor: null
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
  /api/v1/jobs/{job_id}:
    get:
      summary: 查询任务状态
      description: 所属父会话读取任务进度、重试状态与阶段耗时；GET 天然幂等。
      operationId: getJob
      security:
      - ParentSession: []
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 查询任务状态成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                job_id: 65d7a861-4ef1-42db-b8c2-23260b0dd902
                state: running
                stage: claimed
                progress: null
                attempt: 1
                retrying: false
                timing_ms:
                  queue: 2000
                  render: 25000
                  upload: 0
                  total: 30000
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
  /api/v1/episodes/{episode_id}:
    get:
      summary: 读取集详情
      description: 账号所属资源仅限所属父会话，official 可匿名读取，已删和越租户资源返回 404；GET 天然幂等。
      operationId: getEpisode
      security:
      - ParentSession: []
      - {}
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: 读取集详情成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDetail'
              example:
                id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                title: 分糖
                status: making
                current_version: 1
                latest_version: 2
                playable: true
                summary:
                  version: 1
                  segments:
                  - title: 平均分
                    text: 每个人一样多
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
    delete:
      summary: 删除一集
      description: 所属父会话标记删除并异步清理媒体，重复删除返回相同结果，不表示对象已清理；必须携带幂等键。
      operationId: deleteEpisode
      security:
      - ParentSession: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/EpisodeId'
      responses:
        '202':
          description: 删除一集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEpisode'
              example:
                episode_id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                deleted: true
                media_purge: pending
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgress'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
  /api/v1/episodes/{episode_id}/versions:
    post:
      summary: 修改这一集或重试
      description: 所属父会话改输入、重做画面或重试均重新门禁并创建新任务，不恢复旧任务终态；必须携带幂等键。
      operationId: reviseEpisode
      security:
      - ParentSession: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/EpisodeId'
      responses:
        '202':
          description: 修改这一集或重试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
              example:
                episode_id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                version: 2
                job_id: 65d7a861-4ef1-42db-b8c2-23260b0dd902
                state: queued
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailableGateDown'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgressActiveJobVersionConflict'
        '402':
          $ref: '#/components/responses/Error402QuotaExceeded'
        '422':
          $ref: '#/components/responses/Error422GateGuideGateRefuse'
        '200':
          description: 内容拒绝或一次追问；没有创建集、排队或扣额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseRequest'
            example:
              base_version: 1
              revision_kind: text
              prompt: 九颗糖分给三个人
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - GATE_DOWN
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
      - ACTIVE_JOB
      - VERSION_CONFLICT
      - QUOTA_EXCEEDED
      - GATE_GUIDE
      - GATE_REFUSE
  /api/v1/search:
    get:
      summary: 搜索可见的集
      description: 搜索公开可见的集；无会话或无效会话按匿名处理，登录父用户额外可见自己的集。scope 可省略；mine 与默认相同，official 仅公开集。仅搜索 title/group_key，不搜索原始 prompt。空白查询返回 items=[]、next_cursor=null、empty_reason=empty_query；无匹配返回 empty_reason=no_matches。
      operationId: searchEpisodes
      security:
      - {}
      - ParentSession: []
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/SearchScope'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 搜索可见的集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
              example:
                items:
                - id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                  title: 分糖
                next_cursor: null
        '400':
          $ref: '#/components/responses/Error400InvalidArgumentInvalidScope'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - INVALID_SCOPE
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
  /api/v1/episodes/{episode_id}/playback:
    get:
      summary: 取得一个播放地址
      description: 所属父/子会话可播放自家资源，official 可匿名；视口高大于宽选竖幅，否则或缺省选横幅，旋转时保持版本/进度重新取址；GET
        天然幂等但每次重新签名，签名过期后重新鉴权取址。
      operationId: getPlayback
      security:
      - ParentSession: []
      - ChildSession: []
      - {}
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/EpisodeId'
      - $ref: '#/components/parameters/ViewportWidth'
      - $ref: '#/components/parameters/ViewportHeight'
      - $ref: '#/components/parameters/Version'
      - $ref: '#/components/parameters/ExcludeKind'
      responses:
        '200':
          description: 取得一个播放地址成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
              example:
                version: 1
                kind: video_portrait
                url: http://192.0.2.1/media/967c780d-d22b-4f85-ac75-cb8093a0bf47/18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01/v1/video_portrait.mp4?e=1794189600&s=example-signature
                expires_at: '2026-11-09T02:00:00Z'
          headers:
            Cache-Control:
              description: 不缓存签名结果。
              schema:
                $ref: '#/components/schemas/NoStore'
              example: no-store
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailableMediaUnavailable'
        '409':
          $ref: '#/components/responses/Error409NotReady'
        '410':
          $ref: '#/components/responses/Error410MediaExpired'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - MEDIA_UNAVAILABLE
      - NOT_READY
      - MEDIA_EXPIRED
  /api/v1/child/episodes:
    get:
      summary: 列出儿童可播放的集
      description: 子会话或父会话预览仅列自家未删且可播集，不包含 prompt、失败原因或用户资料；GET 天然幂等。
      operationId: listChildEpisodes
      security:
      - ChildSession: []
      - ParentSession: []
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 列出儿童可播放的集成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildEpisodeList'
              example:
                items:
                - id: 18f073f0-5ff1-4ea0-bb3f-1a6c8b991a01
                  title: 分糖
                  current_version: 1
                next_cursor: null
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
  /api/v1/child-sessions:
    post:
      summary: 签发儿童会话
      description: 父会话签发仅可读取儿童列表和自家播放的会话，有效期至多 2h 且不超过父会话；必须携带幂等键，记录仅存会话引用，短期安全重放不向
        PG 写明文 token。
      operationId: createChildSession
      security:
      - ParentSession: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 签发儿童会话成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                token: example-opaque-child-token
                expires_at: '2026-11-09T02:00:00Z'
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
  /api/v1/jobs/{job_id}/cancel:
    post:
      summary: 取消任务
      description: 所属父会话请求取消任务，已取消返回 200，已完成返回冲突；必须携带幂等键。
      operationId: cancelJob
      security:
      - ParentSession: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 取消任务成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellingJob'
              example:
                job_id: 65d7a861-4ef1-42db-b8c2-23260b0dd902
                state: cancelling
        '200':
          description: 取消任务成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledJob'
              example:
                job_id: 65d7a861-4ef1-42db-b8c2-23260b0dd902
                state: cancelled
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgressAlreadyCompleted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
      - ALREADY_COMPLETED
  /api/v1/plaza/groups:
    get:
      summary: 列出广场分组
      description: 匿名读取审核后的 official 分组，首屏每组 2×columns 条，看更多使用组内游标显式分页而非无限加载；GET 天然幂等。
      operationId: listPlazaGroups
      security: []
      x-idempotency: natural
      parameters:
      - $ref: '#/components/parameters/Columns'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/GroupKey'
      responses:
        '200':
          description: 列出广场分组成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlazaGroups'
              example:
                groups:
                - group_key: count
                  items: []
                  remaining: 8
                  next_cursor: example-opaque-count-cursor
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequired'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
      x-error-codes:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      x-draft-open-questions:
      - §6 未定义看更多的组选择参数，以及 limit 与首屏 2×columns 的优先级；这里只暴露统一 limit/cursor，不新增组查询参数，冻结前需确认。
  /api/v1/auth/email/challenges:
    post:
      summary: 发起邮箱验证
      description: 匿名请求由 IdP 签发至多 10 分钟的 challenge，按 IP/目标频控且账号存在与否同响应；必须携带幂等键，匿名幂等由
        IdP 实现。
      operationId: createEmailChallenge
      security: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 发起邮箱验证成功
          content:
            application/json:
              schema:
