    post:
      summary: 验证邮箱并取得父会话
      description: 匿名提交 challenge 和单次验证码换取至多 24h 的父会话；必须携带幂等键，由 IdP 保证重放不重复消耗验证码，Tellkit
        不存验证码。
      operationId: verifyEmail
      security: []
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 验证邮箱并取得父会话成功
          headers:
            Set-Cookie:
              description: '浏览器会话 Cookie：Set-Cookie: tk_session=…; HttpOnly; Secure;
                SameSite=Lax; Max-Age=…; Path=/。 Max-Age 为会话剩余有效秒数，与 expires_at 一致，不改变父会话至多
                24h 的既有上限。 响应体 token 保持原语义，作为非浏览器客户端通过 Bearer 认证的兜底。'
              schema:
                type: string
              example: tk_session=example-opaque-parent-token; HttpOnly; Secure; SameSite=Lax;
                Max-Age=86400; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyResponse'
              example:
                token: example-opaque-parent-token
                expires_at: '2026-11-10T00:00:00Z'
                account:
                  email_masked: dzq***@gmail.com
                  nickname: 纸飞机
                  avatar_seed: example-avatar-seed
                  is_new: false
        '400':
          $ref: '#/components/responses/Error400InvalidArgument'
        '401':
          $ref: '#/components/responses/Error401AuthRequiredInvalidCode'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
        '503':
          $ref: '#/components/responses/Error503DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Error409IdempotencyConflictRequestInProgress'
        '410':
          $ref: '#/components/responses/Error410ChallengeExpired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
            example:
              challenge_id: 5aa1fbec-e648-483f-b830-4419d6afc047
              code: '123456'
