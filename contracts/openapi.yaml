            required: [id, kind, text]
            properties:
              id: {type: string, pattern: '^s[1-5]$'}
              kind: {type: string, enum: [what, why, how]}
              text: {type: string, minLength: 8, description: 一句一陈述；默认10–30汉字，调整后容许8–36汉字}
