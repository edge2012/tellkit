          description: Accepted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 需有效 active 父账号，举报社区作品。按账号标识去重，跨会话及工作区重复举报不累加。第二位举报者触发 hidden_pending_review，立即退出广场及公开详情/播放接口；作者仍可见。无需
        Idempotency-Key。 作者不可举报自己工作区的作品，返回 400 CANNOT_REPORT_OWN。管理员复核结清本轮举报后可再次举报。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reportEpisodeRequest'
components:
  securitySchemes:
    ParentSessionCookie:
      type: apiKey
      in: cookie
      name: tk_session
      description: 浏览器父会话凭据，与 ParentSession 的 Bearer token 对应同类会话；HttpOnly、Secure、SameSite=Lax，Path=/。
    ParentSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-parent
      description: 父会话上限 24h；API 仅存 token_hash。
    ChildSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-child
      description: 儿童只读会话上限 2h 且不超过父会话；不得提交、修改、删除或普通搜索。
  parameters:
    GroupKey:
      name: group_key
      in: query
      required: false
      description: 只取某一组（缺省返回全部分组）。配合 limit 使用时，limit 优先于默认的 2×columns。
      schema:
        type: string
        maxLength: 32
        pattern: ^[a-z0-9_-]+$
      example: count
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: 客户端 UUID；workspace+principal+operation 作用域。同键同规范化请求重放原结果；不同 body
        返回 409 IDEMPOTENCY_CONFLICT。处理中返回 409 REQUEST_IN_PROGRESS 和 Retry-After。完成键保留至
        workspace 生命周期结束；删除后重放返回 tombstone，不重建任务。匿名身份接口由 IdP 实现幂等。
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    SearchScope:
      name: scope
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Scope'
    Scope:
      name: scope
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Scope'
    Query:
      name: q
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/SearchQuery'
    ViewportWidth:
      name: viewport_width
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ViewportDimension'
    ViewportHeight:
      name: viewport_height
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ViewportDimension'
    Version:
      name: version
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Version'
      description: 缺省当前已发布版；指定版本必须已发布且仍获授权。
    ExcludeKind:
      name: exclude_kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/VideoKind'
      description: 播放错误后排除此画幅，申请同版另一画幅；仍只返回一个 URL。
    Columns:
      name: columns
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Columns'
      description: 首屏每组 2×columns 条；§6 未规定 columns 缺省值。
    EpisodeScope:
      name: scope
      in: query
      schema:
        type: string
        enum:
        - mine
        - plaza
      description: Default mine; plaza is public and returns official first, then
        community by publication time.
  schemas:
    StoryboardShape:
      type: string
      enum: ["ape_bent", "ape_upright", "apple", "arrow", "bacteria", "block", "boat", "book", "bowl", "brain", "campfire", "candy", "car", "card", "channel", "charge", "check", "child", "circle", "cloud", "cold", "cookie", "cookie_half", "cookie_large", "cookie_small", "cookie_whole", "cross", "cup", "curved_arrow", "diagram_box", "drop", "drum", "ear", "ear_section", "earth", "foot_left", "foot_right", "force", "grass", "graupel", "ground", "heart", "heat", "house", "human_bent", "human_standing", "ice", "ice_block", "ice_melting", "jar", "knife", "lightning", "many", "memory_card", "moon", "mountain", "question", "rain", "rain_basin", "rainbow", "river", "rotation_axis", "rotation_globe", "route_long", "route_short", "shoe", "shoe_left", "shoe_right", "silhouette_leaning", "silhouette_quadruped", "silhouette_upright", "silhouette_upright_tool", "sleeping_child", "sound", "spear", "square", "star", "stick", "stone", "stone_axe", "sugar_grains", "sugar_solution", "sun", "sun_ray", "tank", "tank_stone", "tank_wood", "time", "timeline", "timeline_axis", "tooth", "toothbrush", "tree", "triangle", "vapor_particles", "vibration", "water", "water_cup_tall", "water_cup_wide", "water_drop", "wind", "wood"]
    StoryboardLayout:
      type: string
      enum: ["single", "compare", "sequence", "stack", "ladder", "zoom", "narration"]
    Storyboard:
      $ref: "./storyboard.schema.json"
    WorkerBrief:
      type: object
      additionalProperties: false
      required:
      - prompt
      - child_age
      - max_seconds
      properties:
        prompt:
          type: string
        child_age:
          type: integer
        max_seconds:
          type: integer
          minimum: 20
          maximum: 180
          default: 90
          description: Duration upper bound only; content determines actual duration.
            Configured by EPISODE_MAX_SECONDS.
    EmailMasked:
      type: string
      description: 邮箱脱敏：本地部分保留前 3 位（不足 3 位保留 1 位），其余用 ***，域名完整保留。
      examples:
      - dzq***@gmail.com
      - a***@example.com
    Nickname:
      type: string
      minLength: 2
      maxLength: 12
      description: 2–12 个字符，允许中英文/数字，不允许空白开头结尾、不允许连续空白，不允许纯符号；允许重复。
    AccountSummary:
      type: object
      additionalProperties: false
      required:
      - email_masked
      - nickname
      - avatar_seed
      - is_new
      properties:
        email_masked:
          $ref: '#/components/schemas/EmailMasked'
        nickname:
          $ref: '#/components/schemas/Nickname'
        avatar_seed:
          type: string
          description: 用于生成头像的稳定种子，不是上传图片地址。
        is_new:
          type: boolean
          description: true 表示本次邮箱验证新建了账号，前端据此进入欢迎页；已有账号为 false。
    EmailVerifyResponse:
      type: object
      additionalProperties: false
      description: 在原 Session 响应字段基础上仅增加 account；token 与 expires_at 的类型、必填性和语义不变。
      required:
      - token
      - expires_at
      properties:
        token:
          $ref: '#/components/schemas/Token'
        expires_at:
          $ref: '#/components/schemas/UTCDateTime'
        account:
          $ref: '#/components/schemas/AccountSummary'
          description: 新增账号摘要；为兼容既有响应未加入 required。
        needs_password:
          type: boolean
          description: 无密码老账号返回 true；请通过 POST /me/password 设置密码。
    MeResponse:
      type: object
      additionalProperties: false
      required:
      - email_masked
      - nickname
      - avatar_seed
      - episode_count
      - created_at
      - is_new
      - quota
      properties:
        quota:
          $ref: '#/components/schemas/AccountQuota'
        email_masked:
          $ref: '#/components/schemas/EmailMasked'
        nickname:
          $ref: '#/components/schemas/Nickname'
        avatar_seed:
          type: string
          description: 用于生成头像的稳定种子，不是上传图片地址。
        episode_count:
          $ref: '#/components/schemas/Count'
          description: 当前账号的集数。
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
          description: 账号创建时间。
        is_new:
          type: boolean
          description: 当前会话对应的邮箱验证是否新建了账号；与该次 verify 的 account.is_new 一致，读取或改昵称不改变此标记。
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required:
      - nickname
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'
    NicknameValidationError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - retryable
          - request_id
          properties:
            code:
              type: string
              const: INVALID_NICKNAME
              description: 仅用于 PATCH /api/v1/me 的 422；不改变既有 ErrorCode 枚举及 HTTP 映射。
            message:
              type: string
            retryable:
              type: boolean
              const: false
            request_id:
              $ref: '#/components/schemas/UUID'
    UUID:
      type: string
      format: uuid
    UTCDateTime:
      type: string
      format: date-time
      pattern: Z$
      description: UTC 时间，以 Z 结尾。
    Text:
      type: string
    Boolean:
      type: boolean
    Version:
      type: integer
      minimum: 1
    CurrentVersion:
      type:
      - integer
      - 'null'
      minimum: 1
      description: 当前已发布版本；尚无发布版本时为 null。
    LatestVersion:
      type: integer
      minimum: 0
    Limit:
      type: integer
      default: 20
      minimum: 1
      maximum: 50
    Cursor:
      type: string
      description: 不透明的 (created_at,id) 游标；客户端原样回传。
    CardSubtitle:
      type: string
      maxLength: 20
      description: 卡片副标题，≤10 个汉字（20 字符），单行省略；由内容侧摘要生成，不用原始 prompt。
    DurationSeconds:
      type: integer
      minimum: 1
      maximum: 600
      description: 成片时长（秒）。不可播放时为省略字段，不返回 0。
    CoverURL:
      type: string
      description: 封面（成片首帧）的带签名 URL，TTL 60 分钟；不可播放时省略。
    NextCursor:
      type:
      - string
      - 'null'
      description: 下一页不透明游标；无下一页为 null。
    Prompt:
      type: string
      minLength: 1
      maxLength: 2000
    Count:
      type: integer
      minimum: 0
    ViewportDimension:
      type: integer
      minimum: 1
      maximum: 16384
    VideoKind:
      type: string
      enum:
      - video_landscape
      - video_portrait
    Scope:
      type: string
      enum:
      - mine
      - official
    SearchQuery:
      type: string
      minLength: 0
      maxLength: 100
    Columns:
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
    EpisodeStatus:
      type: string
      enum:
      - making
      - ready
      - failed
      - cancelled
      - deleted
    JobState:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelling
      - cancelled
    QueuedState:
      type: string
      const: queued
    CancellingState:
      type: string
      const: cancelling
    CancelledState:
      type: string
      const: cancelled
    Progress:
      type: integer
      minimum: 0
      maximum: 100
    RevisionKind:
      type: string
      enum:
      - text
      - visual
      - retry
    URI:
      type: string
      format: uri
    Token:
      type: string
      description: 不透明会话 token；仅保存在前端内存，不写 URL/localStorage。
    Email:
      type: string
      format: email
      description: 仅转发身份服务，不落 Tellkit 日志或 PG。
    OTP:
      type: string
      description: 单次验证码，仅在内存转发；§6 未规定长度或字符集。
    ChallengeTTL:
      type: integer
      maximum: 600
      description: 有效期秒数，由 IdP 签发，上限 10 分钟。
    RetryAfter:
      type: integer
      description: 再次尝试前等待的秒数。
    NoStore:
      type: string
      const: no-store
    GateDecision:
      type: string
      enum:
      - guide
      - refuse
      - down
    ReasonCodes:
      type: array
      items:
        $ref: '#/components/schemas/Text'
      description: 由门禁规则版本决定；§6 未给出封闭枚举。
    'True':
      type: boolean
      const: true
    Pending:
      type: string
      const: pending
    EmptyRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    ErrorCode:
      type: string
      enum:
      - INVALID_ARGUMENT
      - AUTH_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - IDEMPOTENCY_CONFLICT
      - REQUEST_IN_PROGRESS
      - QUOTA_EXCEEDED
      - WORKSPACE_BUSY
      - ACTIVE_JOB
      - VERSION_CONFLICT
      - NOT_READY
      - MEDIA_EXPIRED
      - CHALLENGE_EXPIRED
      - MEDIA_UNAVAILABLE
      - GATE_GUIDE
      - GATE_REFUSE
      - GATE_DOWN
      - CONTENT_REJECTED
      - RATE_LIMITED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL
      - LEASE_LOST
      - INVALID_SCOPE
      - ALREADY_COMPLETED
      - INVALID_CODE
      - INVALID_CREDENTIALS
      - ACCOUNT_EXISTS
      - PASSWORD_INVALID
      - DECLARATION_REQUIRED
      - CONTENT_NEEDS_REVIEW
      - PUBLISH_RATE_LIMITED
      - CANNOT_REPORT_OWN
      description: 与 errors.md 完全一致；保留码不代表已有对外 HTTP 映射。
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/Text'
        retryable:
          $ref: '#/components/schemas/Boolean'
        request_id:
          $ref: '#/components/schemas/UUID'
        details:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - quota_limit
            - quota_used
            - refund_pending
            properties:
              quota_limit:
                type: integer
                minimum: 0
                description: 该工作区累计额度上限，无按月重置。
              quota_used:
                type: integer
                minimum: 0
                description: 已用额度，含未退还的占用。
              period:
                type: string
                enum: [day]
              refund_pending:
                type: integer
                minimum: 0
                description: 失败或取消任务尚未退回的额度数量。
          - type: object
            additionalProperties: false
            required:
            - reason_codes
            properties:
              reason_codes:
                type: array
                items:
                  type: string
    Gate:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason_codes
      properties:
        decision:
          $ref: '#/components/schemas/GateDecision'
        reason_codes:
          $ref: '#/components/schemas/ReasonCodes'
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        gate:
          $ref: '#/components/schemas/Gate'
      description: 统一错误；不回显输入原文或供应商堆栈。门禁类错误必须包含 gate。
      allOf:
      - $ref: '#/components/schemas/GateRequired'
      - if:
          properties:
            error:
              properties:
                code:
                  const: GATE_GUIDE
        then:
          properties:
            gate:
              properties:
                decision:
                  const: guide
      - if:
          properties:
            error:
              properties:
                code:
                  const: GATE_REFUSE
        then:
          properties:
            gate:
              properties:
                decision:
                  const: refuse
      - if:
          properties:
            error:
              properties:
                code:
                  const: GATE_DOWN
        then:
          properties:
            gate:
              properties:
                decision:
                  const: down
    GateRequired:
      if:
        properties:
          error:
            properties:
              code:
                enum:
                - GATE_GUIDE
                - GATE_REFUSE
                - GATE_DOWN
      then:
        required:
        - gate
    SubmitRequest:
      type: object
      additionalProperties: false
      required:
      - prompt
      properties:
        prompt:
          $ref: '#/components/schemas/Prompt'
        input_source:
          type: string
          enum:
          - voice
          - typed
          - share
        clarification_attempted:
          type: boolean
    ReviseRequest:
      type: object
      additionalProperties: false
      required:
      - base_version
      - revision_kind
      properties:
        base_version:
          $ref: '#/components/schemas/Version'
        revision_kind:
          $ref: '#/components/schemas/RevisionKind'
        prompt:
          $ref: '#/components/schemas/Prompt'
        input_source:
          type: string
          enum:
          - voice
          - typed
          - share
        clarification_attempted:
          type: boolean
      description: text 必须传 prompt；visual/retry 不得传 prompt；三种修改都重新门禁。
      if:
        properties:
          revision_kind:
            const: text
      then:
        required:
        - prompt
      else:
        not:
          required:
          - prompt
    AcceptedJob:
      type: object
      additionalProperties: false
      required:
      - episode_id
      - version
      - job_id
      - state
      properties:
        episode_id:
          $ref: '#/components/schemas/UUID'
        version:
          $ref: '#/components/schemas/Version'
        job_id:
          $ref: '#/components/schemas/UUID'
        state:
          $ref: '#/components/schemas/QueuedState'
    TimingMs:
      type: object
      additionalProperties: false
      required:
      - queue
      - render
      - upload
      - total
      properties:
        queue:
          $ref: '#/components/schemas/Count'
        render:
          $ref: '#/components/schemas/Count'
        upload:
          $ref: '#/components/schemas/Count'
        total:
          $ref: '#/components/schemas/Count'
      description: 各阶段耗时，单位毫秒。
    Job:
      type: object
      additionalProperties: false
      required:
      - job_id
      - state
      - stage
      - progress
      - attempt
      - retrying
      - timing_ms
      properties:
        reason_code:
          type: string
          description: 唯一失败原因码。
        failure_kind:
          type: string
          enum: [infra, content]
        reason:
          type: string
          description: 生成失败的人话原因，不含内部错误码。
        job_id:
          $ref: '#/components/schemas/UUID'
        state:
          $ref: '#/components/schemas/JobState'
        stage:
          $ref: '#/components/schemas/Text'
          description: 真实生命周期阶段：queued（等待调度）、claimed（已领取）、finishing（取消收尾或已结束）；终态由
            state 判断。
        progress:
          anyOf:
          - $ref: '#/components/schemas/Progress'
          - type: 'null'
          description: 未成功时为 null；前端主展示 stage，不推算百分比。
        attempt:
          $ref: '#/components/schemas/Count'
        retrying:
          $ref: '#/components/schemas/Boolean'
        timing_ms:
          $ref: '#/components/schemas/TimingMs'
    EpisodeItem:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - current_version
      - latest_version
      - progress
      - stage
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          $ref: '#/components/schemas/Text'
        status:
          $ref: '#/components/schemas/EpisodeStatus'
        current_version:
          $ref: '#/components/schemas/CurrentVersion'
        latest_version:
          $ref: '#/components/schemas/LatestVersion'
        subtitle:
          $ref: '#/components/schemas/CardSubtitle'
        duration_seconds:
          $ref: '#/components/schemas/DurationSeconds'
        cover_url:
          $ref: '#/components/schemas/CoverURL'
        progress:
          anyOf:
          - $ref: '#/components/schemas/Progress'
          - type: 'null'
          description: 最新在制任务当前尝试实际上报的进度；没有真实进度时明确返回 null，不使用默认值或估算值。
        stage:
          enum:
          - queued
          - claimed
          - finishing
          - null
          description: 最新任务状态：queued → queued，running → claimed，cancelling → finishing；没有在制任务时明确返回
            null。
        visibility:
          type: string
          enum:
          - private
          - official
          - published
          - hidden_pending_review
        source:
          type: string
          enum:
          - official
          - community
        author_display:
          type:
          - string
          - 'null'
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        review:
          $ref: '#/components/schemas/EpisodeReview'
          description: 仅作者可见
    SearchItem:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - progress
      - stage
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          $ref: '#/components/schemas/Text'
        subtitle:
